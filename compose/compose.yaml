name: tabletop

services:
  tabletop:
    image: tabletop-tabletop
    build:
      context: ..
      dockerfile: compose/Dockerfile
    ports:
      - "127.0.0.1:18080:18080"
    environment:
      # Set these public settings to enable Discord sign-in.
      OAUTH2_CLIENT_ID: "${OAUTH2_CLIENT_ID}"
      # Public callback: https://vtt.kaeman.dev/auth/discord/callback
      OAUTH2_REDIRECT_URL: "${OAUTH2_REDIRECT_URL}"
      OAUTH2_CLIENT_SECRET_FILE: /run/secrets/oauth2_client_secret
      TABLETOP_ADMIN_USER_IDS: "${TABLETOP_ADMIN_USER_IDS:-}"
      # Use the bundled MongoDB service unless an external URI is supplied.
      TABLETOP_MONGODB_URI: "${TABLETOP_MONGODB_URI:-mongodb://mongo:27017}"
      TABLETOP_MONGODB_DATABASE: "${TABLETOP_MONGODB_DATABASE:-tabletop}"
      # Limits count local files; MongoDB library bytes are managed separately.
      TABLETOP_STORAGE_LIMIT_BYTES: "${TABLETOP_STORAGE_LIMIT_BYTES:-5368709120}"
      TABLETOP_SESSION_STORAGE_LIMIT_BYTES: "${TABLETOP_SESSION_STORAGE_LIMIT_BYTES:-536870912}"
      TABLETOP_PLUGIN_METADATA_LIMIT_BYTES: "${TABLETOP_PLUGIN_METADATA_LIMIT_BYTES:-1048576}"
      TABLETOP_PLUGIN_CONTENT_LIMIT_BYTES: "${TABLETOP_PLUGIN_CONTENT_LIMIT_BYTES:-16777216}"
    secrets:
      - oauth2_client_secret
    volumes:
      - tabletop-data:/app/data
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
      - database
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongo:
    image: mongo:8.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - database
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  maintenance:
    profiles: [maintenance]
    image: alpine:3.24
    user: "10001:10001"
    volumes:
      - tabletop-data:/data
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 32

volumes:
  tabletop-data:
    name: "${TABLETOP_DATA_VOLUME:-tabletop_tabletop-data}"
  mongodb-data:
    name: "${TABLETOP_MONGODB_DATA_VOLUME:-tabletop_mongodb-data}"
  mongodb-config:
    name: "${TABLETOP_MONGODB_CONFIG_VOLUME:-tabletop_mongodb-config}"

networks:
  default:
  database:
    internal: true

secrets:
  oauth2_client_secret:
    file: ./secrets/oauth2_client_secret
